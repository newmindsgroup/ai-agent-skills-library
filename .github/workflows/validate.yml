name: Validate skills

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install agentskills CLI
        run: pip install agentskills

      - name: Validate all skills
        run: bash scripts/validate-all.sh

      - name: Lint install.sh
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
          severity: warning
